</head><body><div id="root"></div>
<script type="text/babel">
const { MoneyStamp, JobProgressBar, MoneyInput, PricingExplainer, Label, Card, CardContent } = window.GanyuHubDesignSystem_1b2ec0;
function Demo() {
  return (
    <div style={{display:"grid",gap:20}}>

        <div className="row" style={{gap:0,paddingTop:6,flexWrap:"nowrap"}}>

          <MoneyStamp state="payment_disputed" size="sm" style={{marginInline:-4}} />
        </div>
      </div>
      <Card>
        <CardContent style={{padding:20}}>
          <p className="lab" style={{marginBottom:6}}>In place &mdash; on the money's line, at the right margin</p>

          <div style={{marginTop:20}}><JobProgressBar currentIdx={2} /></div>
