<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ganyu Hub — web</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../data.js"></script>
<style>html,body{margin:0}body{background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-body);font-size:var(--text-sm)}*{box-sizing:border-box}ul::-webkit-scrollbar,nav::-webkit-scrollbar{display:none}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="WebShell.jsx"></script>
<script type="text/babel" src="MarketingHome.jsx"></script>
<script type="text/babel" src="BrowseCreatives.jsx"></script>
<script type="text/babel" src="JobsList.jsx"></script>
<script type="text/babel" src="JobDetail.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState("/");
  const [role, setRole] = React.useState("client");
  const [mode, setMode] = React.useState("client");
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };
  React.useEffect(() => { setRole(mode); }, [mode]);
  return (
    <>
      <WebHeader role={role} route={route} go={go} onRole={(r) => { setRole(r); setMode(r); }} />
      {route === "/" && <MarketingHome mode={mode} setMode={setMode} go={go} />}
      {route === "/browse" && <BrowseCreatives go={go} />}
      {route === "/jobs" && <JobsList go={go} />}
      {(route === "/jobs/j1" || route === "/dashboard/jobs" || route === "/jobs/new" || route === "/dashboard/payments") && <JobDetail go={go} />}
      <WebFooter />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
