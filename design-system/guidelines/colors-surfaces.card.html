<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}</style></head><body><div class="row" style="align-items:stretch">
<div style="flex:1;min-width:0;height:100px;border-radius:14px;background:var(--surface-canvas);border:1px solid var(--gh-ink-10);box-shadow:none;padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><p style="margin:0;font-size:13px;font-weight:600;color:var(--gh-ink)">Canvas</p><p style="margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink);opacity:.6">#F7F6F3 ground</p></div><div style="flex:1;min-width:0;height:100px;border-radius:14px;background:var(--surface-card);border:var(--elev-1-border);box-shadow:var(--elev-1);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><p style="margin:0;font-size:13px;font-weight:600;color:var(--gh-ink)">Card</p><p style="margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink);opacity:.6">white, raised</p></div><div style="flex:1;min-width:0;height:100px;border-radius:14px;background:var(--surface-band);border:1px solid var(--gh-ink-10);box-shadow:none;padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><p style="margin:0;font-size:13px;font-weight:600;color:var(--gh-ink)">Band</p><p style="margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink);opacity:.6">#F2F1EE</p></div><div style="flex:1;min-width:0;height:100px;border-radius:14px;background:var(--surface-inset);border:1px solid var(--gh-ink-10);box-shadow:none;padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><p style="margin:0;font-size:13px;font-weight:600;color:var(--gh-ink)">Inset</p><p style="margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink);opacity:.6">#F1F1F0</p></div><div style="flex:1;min-width:0;height:100px;border-radius:14px;background:var(--surface-accent);border:1px solid var(--surface-accent-edge);box-shadow:none;padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><p style="margin:0;font-size:13px;font-weight:600;color:var(--gh-ink)">Accent</p><p style="margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink);opacity:.6">#ECECEC</p></div><div style="flex:1;min-width:0;height:100px;border-radius:14px;background:var(--surface-inverse);border:1px solid transparent;box-shadow:none;padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><p style="margin:0;font-size:13px;font-weight:600;color:var(--gh-ground)">Inverse</p><p style="margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ground);opacity:.6">ink</p></div>
</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--gh-ink-65)">Every step here is small. <b style="font-weight:600">Shadow and hairline carry separation</b>, not the colour difference &mdash; see the elevation card.</p></body></html>
