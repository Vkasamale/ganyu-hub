<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}</style></head><body><div class="row" style="align-items:flex-end">

</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--gh-ink-65)">Warm ink at 4&ndash;12%, low spread, no hard drop shadows. A sheet rising from the bottom edge throws its shadow <i>upward</i>.</p></body></html>
