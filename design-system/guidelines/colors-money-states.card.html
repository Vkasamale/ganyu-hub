<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:stretch}</style></head><body><div class="row">
<div style="flex:1;min-width:0"><div style="height:52px;border-radius:8px;background:var(--money-none-ink)"></div><p style="margin:7px 0 0;font-size:11px;font-weight:600">No payment yet</p><p style="margin:1px 0 0;font-size:10px;font-variant-numeric:tabular-nums;color:var(--gh-ink-50)">#8C8C8C</p></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:8px;background:var(--money-pending-ink)"></div><p style="margin:7px 0 0;font-size:11px;font-weight:600">Payment pending</p><p style="margin:1px 0 0;font-size:10px;font-variant-numeric:tabular-nums;color:var(--gh-ink-50)">#E9A23B</p></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:8px;background:var(--money-held-ink)"></div><p style="margin:7px 0 0;font-size:11px;font-weight:600">In escrow</p><p style="margin:1px 0 0;font-size:10px;font-variant-numeric:tabular-nums;color:var(--gh-ink-50)">#1D6E9E</p></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:8px;background:var(--money-released-ink)"></div><p style="margin:7px 0 0;font-size:11px;font-weight:600">Released</p><p style="margin:1px 0 0;font-size:10px;font-variant-numeric:tabular-nums;color:var(--gh-ink-50)">#1B9455</p></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:8px;background:var(--money-disputed-ink)"></div><p style="margin:7px 0 0;font-size:11px;font-weight:600">In dispute</p><p style="margin:1px 0 0;font-size:10px;font-variant-numeric:tabular-nums;color:var(--gh-ink-50)">#C22A2A</p></div>
</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--gh-ink-65)">The ink of <b style="font-weight:600">MoneyStamp</b>. Grey is a state, not a fallback &mdash; it means no payment yet, and the other four never degrade to it.</p></body></html>
