<!-- @dsCard group="Colors" viewport="700x120" name="Status accents" subtitle="Outside money: availability dots, stars, destructive." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--gh-ink-55);text-transform:uppercase}</style></head><body><div class="row" style="gap:20px">
<div style="display:flex;align-items:center;gap:8px"><span style="height:14px;width:14px;border-radius:9999px;background:var(--status-star);box-shadow:0 0 0 2px #fff"></span><div><p style="margin:0;font-size:12px;font-weight:500">Star (rating)</p><p style="margin:1px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-45)">--status-star</p></div></div><div style="display:flex;align-items:center;gap:8px"><span style="height:14px;width:14px;border-radius:9999px;background:var(--status-available);box-shadow:0 0 0 2px #fff"></span><div><p style="margin:0;font-size:12px;font-weight:500">Available</p><p style="margin:1px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-45)">--status-available</p></div></div><div style="display:flex;align-items:center;gap:8px"><span style="height:14px;width:14px;border-radius:9999px;background:var(--status-busy);box-shadow:0 0 0 2px #fff"></span><div><p style="margin:0;font-size:12px;font-weight:500">Busy</p><p style="margin:1px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-45)">--status-busy</p></div></div><div style="display:flex;align-items:center;gap:8px"><span style="height:14px;width:14px;border-radius:9999px;background:var(--status-away);box-shadow:0 0 0 2px #fff"></span><div><p style="margin:0;font-size:12px;font-weight:500">Not taking work</p><p style="margin:1px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-45)">--status-away</p></div></div><div style="display:flex;align-items:center;gap:8px"><span style="height:14px;width:14px;border-radius:9999px;background:var(--status-danger);box-shadow:0 0 0 2px #fff"></span><div><p style="margin:0;font-size:12px;font-weight:500">Destructive</p><p style="margin:1px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-45)">--status-danger</p></div></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--gh-ink-65)">Amber-400 is the <i>only</i> star colour. Red-600 appears on log out and destructive actions and nowhere else.</p></body></html>
