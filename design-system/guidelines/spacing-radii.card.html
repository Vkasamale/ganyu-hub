<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--gh-ink-55);text-transform:uppercase}</style></head><body><div class="row" style="align-items:flex-end">
<div style="flex:1;min-width:0;text-align:center"><div style="height:56px;border-radius:6px;background:var(--gh-white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><p style="margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-70)">6px</p><p style="margin:2px 0 0;font-size:10px;color:var(--gh-ink-55);line-height:1.3">Buttons, inputs</p></div><div style="flex:1;min-width:0;text-align:center"><div style="height:56px;border-radius:8px;background:var(--gh-white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><p style="margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-70)">8px</p><p style="margin:2px 0 0;font-size:10px;color:var(--gh-ink-55);line-height:1.3">Panels, sheets, tiles</p></div><div style="flex:1;min-width:0;text-align:center"><div style="height:56px;border-radius:12px;background:var(--gh-white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><p style="margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-70)">12px</p><p style="margin:2px 0 0;font-size:10px;color:var(--gh-ink-55);line-height:1.3">Ways-in cards</p></div><div style="flex:1;min-width:0;text-align:center"><div style="height:56px;border-radius:14px;background:var(--gh-white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><p style="margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-70)">14px</p><p style="margin:2px 0 0;font-size:10px;color:var(--gh-ink-55);line-height:1.3">THE card radius</p></div><div style="flex:1;min-width:0;text-align:center"><div style="height:56px;border-radius:16px;background:var(--gh-white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><p style="margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-70)">16px</p><p style="margin:2px 0 0;font-size:10px;color:var(--gh-ink-55);line-height:1.3">Listing cards, drawers</p></div><div style="flex:1;min-width:0;text-align:center"><div style="height:56px;border-radius:9999px;background:var(--gh-white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><p style="margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--gh-ink-70)">9999px</p><p style="margin:2px 0 0;font-size:10px;color:var(--gh-ink-55);line-height:1.3">Chips, avatars, stamp</p></div>
</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--gh-ink-65)">Not rounded-everything. A control and a card are different objects and read that way.</p></body></html>
